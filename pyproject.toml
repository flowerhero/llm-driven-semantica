[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "smini"
version = "0.1.0"
description = "LLM-driven knowledge-graph pipeline: Skill-First, contract-as-rules extraction (entities/relations/attributes/rules/processes + predictive-decision six-pack)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "The semantica-simple contributors" }]
keywords = ["knowledge-graph", "rag", "semantica", "workbuddy", "skill", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.scripts]
smini = "smini.cli:main"

[project.urls]
Homepage = "https://github.com/flowerhero/llm-driven-semantica"
Repository = "https://github.com/flowerhero/llm-driven-semantica"

[tool.setuptools.packages.find]
include = ["smini*"]

[tool.setuptools.package-data]
smini = ["py.typed"]
